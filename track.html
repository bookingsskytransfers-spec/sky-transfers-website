<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Track your driver — Sky Transfers</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#101828">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --ground:#F7F4ED; --card:#FFFFFF; --ink:#141D30; --text:#333B4C; --muted:#68707F;
    --line:#E5E0D2; --gold:#C9A227; --gold-deep:#6F5510; --gold-soft:#F6EED9;
    --navy:#101828; --navy-text:#F6F2E8; --ok:#1E7F4F; --ok-soft:#E3F2EA; --err:#B0392F; --err-soft:#FBE9E7;
    --blue:#1F5FA8; --blue-soft:#E6EFFA;
    color-scheme:light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0F1626; --card:#182031; --ink:#F0EBDD; --text:#D8D4C8; --muted:#98A0B0;
      --line:#2A3549; --gold:#D9B44A; --gold-deep:#E2C46B; --gold-soft:#2C2A1E;
      --navy:#1B2A47; --ok:#4CC08A; --ok-soft:#173326; --err:#E28078; --err-soft:#3A1F1E;
      --blue:#7FB1EE; --blue-soft:#1A2C45;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0F1626; --card:#182031; --ink:#F0EBDD; --text:#D8D4C8; --muted:#98A0B0;
    --line:#2A3549; --gold:#D9B44A; --gold-deep:#E2C46B; --gold-soft:#2C2A1E;
    --navy:#1B2A47; --ok:#4CC08A; --ok-soft:#173326; --err:#E28078; --err-soft:#3A1F1E;
    --blue:#7FB1EE; --blue-soft:#1A2C45;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.45}
  header{background:var(--navy);color:var(--navy-text);padding:18px 16px 16px}
  header .row{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  header img{height:34px;width:auto;display:block}
  header span{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
  main{max-width:560px;margin:0 auto;padding:16px 16px 60px}
  .hello{font-size:15px;color:var(--muted);margin:4px 2px 6px}
  .status{font-size:26px;font-weight:800;color:var(--ink);line-height:1.2;margin:0 2px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .steps li{text-align:center;font-size:12.5px;color:var(--muted);font-weight:600}
  .steps li::before{content:"";display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:7px}
  .steps li.done{color:var(--ink)} .steps li.done::before{background:var(--gold)}
  .steps li.now{color:var(--blue)} .steps li.now::before{background:var(--blue)}
  .when{font-size:28px;font-weight:800;color:var(--ink);line-height:1.1}
  .when small{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-top:4px}
  .route{margin:14px 0 4px}
  .route div{padding:4px 0;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
  .route div span{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .who{display:flex;gap:14px;align-items:center}
  .avatar{flex:0 0 52px;height:52px;border-radius:50%;background:var(--gold-soft);color:var(--gold-deep);
    display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
  .who b{display:block;font-size:19px;color:var(--ink)}
  .who em{font-style:normal;color:var(--muted);font-size:15px}
  .meet{background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:12px;font-size:15.5px;margin-top:14px}
  .contact{display:flex;gap:10px}
  .contact a{flex:1;text-align:center;border-radius:12px;padding:14px 8px;text-decoration:none;font-weight:800;font-size:16px}
  .contact .call{background:var(--navy);color:var(--navy-text)}
  .contact .wa{background:#1E9E57;color:#fff}
  .fine{font-size:13px;color:var(--muted);text-align:center;margin-top:18px}
  .msg{background:var(--err-soft);color:var(--ink);border-radius:12px;padding:16px;font-size:16px}
  .wait{text-align:center;color:var(--muted);padding:40px 12px}
  [hidden]{display:none!important}
  @media (max-width:400px){ .steps li{font-size:11px} .status{font-size:23px} }
</style>
</head>
<body>
<header><div class="row"><img src="/logo.png" alt="Sky Transfers"><span>Your transfer</span></div></header>
<main>
  <p class="wait" id="wait">Finding your booking…</p>
  <div class="msg" id="err" hidden></div>
  <div id="view" hidden>
    <p class="hello" id="hello"></p>
    <p class="status" id="status"></p>
    <div class="card"><ol class="steps" id="steps">
      <li data-s="confirmed">Confirmed</li><li data-s="on_way">On the way</li><li data-s="arrived">Arrived</li><li data-s="on_board">On board</li><li data-s="done">Done</li>
    </ol></div>
    <div class="card">
      <div class="when" id="when"></div>
      <div class="route">
        <div><span>Pick-up</span><b id="from"></b></div>
        <div><span id="to-l">Drop-off</span><b id="to"></b></div>
      </div>
      <div class="meet" id="meet"></div>
    </div>
    <div class="card" id="driver-card" hidden>
      <div class="who"><div class="avatar" id="initial"></div><div><b id="driver"></b><em id="car"></em></div></div>
    </div>
    <div class="contact">
      <a class="call" id="call" href="tel:+61481437772">Call us</a>
      <a class="wa" id="wa" href="https://wa.me/61481437772">WhatsApp</a>
    </div>
    <p class="fine" id="fine">This page updates by itself. Booking <span id="ref"></span>.</p>
  </div>
</main>
<script>
(function(){
  var API = "https://sky-transfers-booking-server.onrender.com";
  function $(id){ return document.getElementById(id); }
  /* The link's key lives in the fragment, which browsers never send to any
     server or put in a Referer. It is POSTed, never put in a URL. */
  var t = (/[#&]t=([^&]+)/.exec(location.hash) || [])[1] || "";
  var ORDER = ["booked", "confirmed", "on_way", "arrived", "on_board", "done"];
  var timer = null;
  function fail(msg){ $("wait").hidden = true; $("view").hidden = true; $("err").hidden = false; $("err").textContent = msg; }
  function render(d){
    $("wait").hidden = true; $("err").hidden = true; $("view").hidden = false;
    $("hello").textContent = d.guest ? "Hi " + d.guest + "," : "";
    $("status").textContent = d.status;
    var at = ORDER.indexOf(d.step);
    Array.prototype.forEach.call($("steps").children, function(li){
      var i = ORDER.indexOf(li.getAttribute("data-s"));
      li.className = i < at || (d.step === "done" && i <= at) ? "done" : i === at ? "now" : "";
    });
    $("when").innerHTML = "";
    $("when").appendChild(document.createTextNode(d.time));
    var sm = document.createElement("small"); sm.textContent = d.day + (d.flight ? " · flight " + d.flight : "") + (d.isReturn ? (d.leg === "ret" ? " · return leg" : " · outbound leg") : "");
    $("when").appendChild(sm);
    $("from").textContent = d.from;
    if (d.hours) { $("to-l").textContent = "Hire"; $("to").textContent = d.hours + " hours as directed"; } else $("to").textContent = d.to;
    $("meet").textContent = d.meet;
    $("meet").hidden = d.step === "on_board" || d.step === "done";
    $("driver-card").hidden = !d.driver;
    if (d.driver) { $("driver").textContent = d.driver; $("initial").textContent = d.driver.charAt(0).toUpperCase(); $("car").textContent = d.car || ""; }
    $("ref").textContent = d.ref;
    $("wa").href = "https://wa.me/61481437772?text=" + encodeURIComponent("Hi Sky Transfers, about booking " + d.ref + ": ");
    $("fine").hidden = d.step === "done";
    clearTimeout(timer);
    if (d.step !== "done") timer = setTimeout(load, d.step === "on_way" || d.step === "arrived" ? 20000 : 60000);
  }
  function load(){
    fetch(API + "/track", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t: t }) })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ if (!r.ok) throw new Error(d.error || "Something went wrong. Please call +61 481 437 772."); return d; }); })
      .then(render)
      .catch(function(e){ fail(e.message || "We couldn't load your booking. Please call +61 481 437 772."); });
  }
  if (!t) fail("This link is incomplete. Please open it straight from your email, or call +61 481 437 772.");
  else load();
  document.addEventListener("visibilitychange", function(){ if (!document.hidden && t) load(); });
})();
</script>
</body>
</html>
